name: Selenium Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: '0 2 * * 1-5' # Run at 2 AM weekdays

# Add these permissions at the workflow level
permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHON_VERSION: '3.11'
  
jobs:
  smoke:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@latest
        
      - name: Create test directories
        run: mkdir -p test-results test-logs allure-results screenshots
          
      - name: Run smoke tests
        env:
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          BROWSER: chrome
          HEADLESS: true
          SCREENSHOT_ON_FAILURE: true
        run: |
          pytest -v -m smoke \
            --junitxml="test-results/junit-smoke.xml" \
            --html="test-results/report-smoke.html" \
            --self-contained-html \
            --alluredir=allure-results \
            --reruns 2 \
            --reruns-delay 1 \
            --maxfail=5 \
            --tb=short
            
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-smoke
          path: |
            test-results/
            test-logs/
            screenshots/
            allure-results/
          retention-days: 30

  test:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        test-type: [account_creation_page, eco_friendly_page, sale_page]
        
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@latest
        
      - name: Create test directories
        run: mkdir -p test-results test-logs allure-results screenshots
          
      - name: Run ${{ matrix.test-type }} tests
        env:
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          BROWSER: chrome
          HEADLESS: true
          SCREENSHOT_ON_FAILURE: true
        run: |
          pytest -v -m ${{ matrix.test-type }} \
            --junitxml="test-results/junit-${{ matrix.test-type }}.xml" \
            --html="test-results/report-${{ matrix.test-type }}.html" \
            --self-contained-html \
            --alluredir=allure-results \
            --reruns 2 \
            --reruns-delay 1 \
            --maxfail=5 \
            --tb=short
            
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.test-type }}
          path: |
            test-results/
            test-logs/
            screenshots/
            allure-results/
          retention-days: 30

  # Generate and publish Allure report
  allure-report:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Merge Allure results
        run: |
          mkdir -p allure-results
          find artifacts -name "allure-results" -type d -exec cp -r {}/* allure-results/ \; || true
          ls -la allure-results/ || echo "No allure results found"
          
      - name: Check if gh-pages branch exists
        id: check-branch
        run: |
          if git ls-remote --heads origin gh-pages | grep gh-pages; then
            echo "branch_exists=true" >> $GITHUB_OUTPUT
          else
            echo "branch_exists=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Load test report history
        uses: actions/checkout@v4
        if: steps.check-branch.outputs.branch_exists == 'true'
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
          
      - name: Create empty gh-pages directory if branch doesn't exist
        if: steps.check-branch.outputs.branch_exists == 'false'
        run: |
          mkdir -p gh-pages
          
      - name: Build test report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: allure-results
          
      - name: Ensure allure-history has content
        run: |
          if [ ! -d "allure-history" ] || [ -z "$(ls -A allure-history)" ]; then
            echo "Creating fallback content for allure-history"
            mkdir -p allure-history
            cat > allure-history/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Test Report</title>
              <meta charset="utf-8">
          </head>
          <body>
              <h1>Test Report</h1>
              <p>No test results available yet. Reports will appear here after successful test runs.</p>
              <p>Generated on: $(date)</p>
          </body>
          </html>
          EOF
          fi
          echo "Contents of allure-history:"
          ls -la allure-history/
          
      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          force_orphan: true
          enable_jekyll: false

  # Notify on failure or success
  notify:
    needs: [test, allure-report]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Log failure notification
        if: needs.test.result == 'failure' || needs.allure-report.result == 'failure'
        run: |
          echo "Test failure detected!"
          echo "This is a placeholder notification for the demo project."
          echo "In a real project, this would trigger notifications via Slack, email, or other channels."

      - name: Log success notification
        if: needs.test.result == 'success' && needs.allure-report.result == 'success'
        run: |
          echo "✅ All tests passed successfully!"
          echo "Test results are available in the Allure report."
          echo "In a real project, this would trigger success notifications via Slack, email, or other channels."

