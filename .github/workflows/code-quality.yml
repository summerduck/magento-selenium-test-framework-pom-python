name: Code Quality 

on:
  push:
  pull_request:

jobs:
  code-analysis:
    name: Run code analysis and type checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: .pip_cache
          key: pip-cache-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-cache-

      - name: Add local bin to PATH
        run: export PATH="$HOME/.local/bin:$PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --cache-dir .pip_cache
          pip install pylint
          pylint --version

      - name: Pylint code analysis
        run: |          
          echo "🔍 Starting Pylint code analysis..."
          pylint -j0 tests utils pages data
          pylint_exit_code=$?
          if [ "$pylint_exit_code" -ne 0 ]; then
            echo "❌ Pylint found issues that need to be addressed"
            exit $pylint_exit_code
          fi
          echo "✅ Pylint analysis completed successfully"

      - name: Store cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .pip_cache
          key: pip-cache-${{ hashFiles('requirements.txt') }} 