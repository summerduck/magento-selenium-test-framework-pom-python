[pytest]
testpaths = tests
python_files = test_*
python_classes = *Test
python_functions = test_*
log_cli = true
log_level = DEBUG
markers=
        # smoke test markers
        smoke
        # validation test markers
        validation

;addopts = --template=html1/index.html --report=report.html
addopts = -v --junitxml="result.xml" --html=report.html --self-contained-html --log-format='%(asctime)s [%(levelname)s] [%(name)s] %(message)s'